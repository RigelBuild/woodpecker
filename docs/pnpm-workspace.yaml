packages:
  - '.'
  - 'plugins/**'

allowBuilds:
  '@swc/core': false
  core-js: false

overrides:
  serialize-javascript: '^7.0.5'
  uuid: '^14.0.0'
  brace-expansion: '^5.0.0'
  # CVE floors: these parents pin older patch releases that their ranges allow
  # past. qs needs 6.16 (body-parser pins ~6.15, which has no fixed release).
  colord: '^2.9.4'
  fast-uri: '^3.1.8'
  js-yaml: '^4.3.2'
  qs: '^6.16.0'
  svgo: '^3.3.5'

  # image-size is archived upstream and its last release (2.0.2) is affected by
  # CVE-2025-71329 and CVE-2025-71330 with no fixed version available.
  # image-size-next is a drop-in community fork of 2.0.2 carrying those fixes.
  image-size: 'npm:image-size-next@^2.1.1'
