  test:
    depends_on:
      - dummy-web
    image: *golang_image
    commands:
      - make test-agent
      - make test-server
      - make test-cli
      - make test-lib
    when:
      - path: *when_path

  test-e2e:
    depends_on:
      - test
    image: *golang_image
    commands:
      - make test-e2e
    when:
      - path: *when_path

  test-fuzz:
    depends_on:
      - test-e2e
    image: *golang_image
    commands:
      - make fuzz
    environment:
      FUZZ_TIME: 2s
    when:
      - path: *when_path

  sqlite:
    depends_on:
      - test-fuzz
    image: *golang_image
    environment:
      WOODPECKER_DATABASE_DRIVER: sqlite3
    commands:
      - make test-server-datastore-coverage
    when:
      - path: *when_path
