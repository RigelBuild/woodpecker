name: publish-agent-image

# Publishes the multi-arch woodpecker-agent image to GHCR for the Rigel
# elastic-runner pool. The pool's AGENT_IMAGE pins the exact version tag this
# workflow produces (ghcr.io/rigelbuild/woodpecker-agent:<version>).
#
# The agent Dockerfile (docker/Dockerfile.agent.multiarch) builds on the native
# BUILDPLATFORM and Go-cross-compiles to TARGETARCH, and its final stage is
# FROM scratch (COPY-only), so linux/arm64 is produced by cross-compile without
# QEMU execution.
#
# The version comes from the `version = "..."` literal in flake.nix — the same
# string the server build stamps in — so server and agent cannot carry
# different versions from one fork commit. This fires on every push to main
# rather than on a tag: the fork keeps no tags, so a tag trigger published
# exactly once in its lifetime and left the pool a minor version behind the
# server (RIG-2217). Re-pushing an unchanged version is a no-op at the
# registry, which dedups by content digest.

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: rigelbuild/woodpecker-agent

jobs:
  publish-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*version = "\(.*\)";$/\1/p' flake.nix | head -1)"
          if [ -z "$version" ]; then
            echo "could not read the version literal from flake.nix" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Publishing agent image version: ${version}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.agent.multiarch
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            CI_COMMIT_TAG=v${{ steps.version.outputs.version }}
            CI_COMMIT_SHA=${{ github.sha }}
            CI_COMMIT_BRANCH=${{ github.ref_name }}
