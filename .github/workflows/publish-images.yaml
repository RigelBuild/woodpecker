name: publish-images

'on':
  push:
    tags:
      - 'v*.*.*-rigel.*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to rehearse; must match flake.nix
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  AGENT_IMAGE: ghcr.io/rigelbuild/woodpecker-agent
  SERVER_IMAGE: ghcr.io/rigelbuild/woodpecker-server

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require release-branch dispatch
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/rigel-release'
        run: |
          echo '::error::workflow_dispatch is only allowed from rigel-release' >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require release ancestry
        env:
          REF: ${{ github.ref }}
        run: .github/scripts/check-release-source.sh "$REF"

      - name: Resolve and validate version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF: ${{ github.ref }}
        run: |
          version="$(.github/scripts/resolve-image-version.sh "$EVENT" "$REF" "$INPUT_VERSION" flake.nix)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Validated release version: $version"

  web:
    needs: resolve
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Build UI
        run: |
          corepack enable
          make build-ui

      - name: Upload UI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  server-binaries:
    needs: [resolve, web]
    runs-on: ubuntu-24.04
    container:
      image: docker.io/techknowlogick/xgo:go-1.27.x@sha256:783cf55bdb2d7e24d30758465f7b3c820328e0a4414f8ebe2f924dc882895b52 # go-1.27.x
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download UI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist

      - name: Cross-compile server binaries
        env:
          CI_COMMIT_TAG: v${{ needs.resolve.outputs.version }}
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_COMMIT_BRANCH: rigel-release
          PLATFORMS: linux|amd64;linux|arm64/v8
          TAGS: sqlite sqlite_unlock_notify netgo
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          go mod vendor
          make cross-compile-server

      - name: Upload server binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-binaries
          path: dist/server
          if-no-files-found: error

  agent-publish:
    if: github.event_name == 'push'
    needs: resolve
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push agent by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.agent.multiarch
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          outputs: type=image,name=${{ env.AGENT_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            CI_COMMIT_TAG=v${{ needs.resolve.outputs.version }}
            CI_COMMIT_SHA=${{ github.sha }}
            CI_COMMIT_BRANCH=rigel-release

  agent-rehearsal:
    if: github.event_name == 'workflow_dispatch'
    needs: resolve
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build agent rehearsal
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.agent.multiarch
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: mode=max
          build-args: |
            CI_COMMIT_TAG=v${{ needs.resolve.outputs.version }}
            CI_COMMIT_SHA=${{ github.sha }}
            CI_COMMIT_BRANCH=rigel-release

  server-publish:
    if: github.event_name == 'push'
    needs: [resolve, server-binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download server binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-binaries
          path: dist/server

      - name: Lay out binaries for the Dockerfile
        run: |
          for arch in amd64 arm64; do
            chmod 0755 "dist/server/linux_${arch}/woodpecker-server"
          done

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.server.multiarch.rootless
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          outputs: type=image,name=${{ env.SERVER_IMAGE }},push-by-digest=true,name-canonical=true,push=true

  server-rehearsal:
    if: github.event_name == 'workflow_dispatch'
    needs: [resolve, server-binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download server binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-binaries
          path: dist/server

      - name: Lay out binaries for the Dockerfile
        run: |
          for arch in amd64 arm64; do
            chmod 0755 "dist/server/linux_${arch}/woodpecker-server"
          done

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build server rehearsal
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.server.multiarch.rootless
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: mode=max

  finalize:
    if: github.event_name == 'push'
    needs: [resolve, agent-publish, server-publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      # Finalize runs repo scripts, so it needs the tagged tree.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply release tags and record manifest digests
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
          AGENT_DIGEST: ${{ needs.agent-publish.outputs.digest }}
          SERVER_DIGEST: ${{ needs.server-publish.outputs.digest }}
        run: .github/scripts/finalize-images.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          tag="v${VERSION}"
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" >/dev/null 2>&1; then
            echo "GitHub Release ${tag} already exists"
          else
            gh release create "$tag" --verify-tag --generate-notes
          fi
